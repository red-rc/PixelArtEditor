name: Avalonia Cross-Platform Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build for ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: win-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: osx-x64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    env:
      Project_Path: Pixeller.Desktop/Pixeller.Desktop.csproj
      Output_Path: output/${{ matrix.target }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '10.0.302'

      - name: Publish Application
        run: >
          dotnet publish ${{ env.Project_Path }}
          -c Release
          -r ${{ matrix.target }}
          --self-contained true
          -p:PublishAot=true
          -p:PublishTrimmed=true
          -p:TrimMode=full
          -o ${{ env.Output_Path }}

      - name: Inspect publish output
        shell: bash
        run: |
          echo "Project: ${{ env.Project_Path }}"
          echo "Target: ${{ matrix.target }}"
          find "${{ env.Output_Path }}" -maxdepth 2 -type f -print
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: Avalonia-${{ matrix.target }}
          path: ${{ env.Output_Path }}
